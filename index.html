<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boleta | Sistema de Gestión</title>
<style>
  /* ================================================
     SISTEMA DE BOLETAS - Estilo Propio
     Paleta: Negro / Celeste / Blanco
     ================================================ */

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
    background: #000000;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Contenedor principal */
  .panel {
    background: #0a0a0a;
    border: 1px solid rgba(0, 212, 255, 0.2);
    border-radius: 20px;
    padding: 28px;
    max-width: 580px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 212, 255, 0.05) inset;
    transition: all 0.3s ease;
  }

  .panel:hover {
    border-color: rgba(0, 212, 255, 0.4);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 212, 255, 0.08);
  }

  /* Header */
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(0, 212, 255, 0.3);
  }

  .title {
    font-size: 1.6rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff, #00d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.02em;
  }

  .badge {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: #00d4ff;
    text-transform: uppercase;
    background: rgba(0, 212, 255, 0.1);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(0, 212, 255, 0.3);
  }

  /* Campos de formulario */
  .field {
    margin-bottom: 16px;
  }

  .label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #00d4ff;
    margin-bottom: 6px;
  }

  .label span {
    color: #555;
    margin-left: 8px;
    font-size: 0.6rem;
    font-weight: normal;
  }

  input, select {
    width: 100%;
    padding: 10px 14px;
    background: #0d0d0d;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    font-size: 0.85rem;
    color: #ffffff;
    transition: all 0.2s ease;
    font-family: monospace;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #00d4ff;
    box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.15);
  }

  input:hover, select:hover {
    border-color: #333;
  }

  /* Grids */
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }

  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .grid-4 .field {
    margin-bottom: 0;
  }

  /* Botones */
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 8px;
  }

  .btn-primary {
    background: transparent;
    border: 1.5px solid #00d4ff;
    color: #00d4ff;
  }

  .btn-primary:hover {
    background: #00d4ff;
    color: #000000;
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.4);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid #333;
    color: #aaa;
  }

  .btn-secondary:hover {
    border-color: #00d4ff;
    color: #00d4ff;
  }

  /* Resultado */
  .result {
    margin-top: 24px;
    padding: 16px;
    background: #050505;
    border: 1px solid #1a1a1a;
    border-radius: 12px;
    display: none;
    border-left: 3px solid #00d4ff;
  }

  .result pre {
    font-family: 'Courier New', 'SF Mono', monospace;
    font-size: 0.8rem;
    color: #e0e0e0;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
  }

  /* Campos condicionales */
  .conditional {
    display: none;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Separador */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 16px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00d4ff, transparent);
  }

  .divider-text {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #00d4ff;
    text-transform: uppercase;
  }

  /* Select pequeño */
  .select-sm {
    font-size: 0.75rem;
    padding: 8px 10px;
  }

  /* Hint / ayuda */
  .hint {
    font-size: 0.6rem;
    color: #555;
    margin-top: 4px;
  }

  /* Status LED */
  .status {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }

  .led {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.6rem;
    color: #00d4ff;
  }

  .led::before {
    content: "●";
    font-size: 0.7rem;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 2px #00d4ff; }
    50% { opacity: 0.5; text-shadow: 0 0 6px #00d4ff; }
  }
</style>
</head>
<body>

<div class="panel">
  <div class="header">
    <h1 class="title">BOLETA</h1>
    <span class="badge">SISTEMA</span>
  </div>

  <div class="status">
    <span class="led">ONLINE</span>
  </div>

  <!-- B - Número de Boleta -->
  <div class="field">
    <div class="label">B <span>[NÚMERO DE BOLETA]</span></div>
    <input type="number" id="numBoleta" placeholder="Ingrese número">
  </div>

  <!-- Técnico y Operador -->
  <div class="grid-2">
    <div class="field">
      <div class="label">TEC <span>[TÉCNICO]</span></div>
      <input list="tecnicos" id="tecnico" placeholder="Seleccione o escriba">
      <datalist id="tecnicos">
        <option>Alejandro J.</option><option>Edwin O.</option><option>Franklin R.</option>
        <option>Javier J.</option><option>Jorge M.</option><option>Manuel G.</option>
        <option>Samuel S.</option><option>Sebastian A.</option><option>Antonio C.</option>
        <option>Alessandro H.</option>
      </datalist>
    </div>
    <div class="field">
      <div class="label">O <span>[OPERADOR]</span></div>
      <input list="operadores" id="operador" placeholder="Seleccione o escriba">
      <datalist id="operadores">
        <option>Daniel H.</option><option>Hector L.</option><option>Josué R.</option>
        <option>Carlos N.</option><option>Eduardo C.</option>
      </datalist>
    </div>
  </div>

  <!-- Tipo de Trabajo y Ubicación -->
  <div class="grid-2">
    <div class="field">
      <div class="label">TT <span>[TRABAJO]</span></div>
      <input type="text" id="tipoTrabajo" value="Nueva instalacion">
    </div>
    <div class="field">
      <div class="label">UP <span>[UBICACIÓN GPS]</span></div>
      <input type="text" id="ubicacion" value="Atras del tacometro">
    </div>
  </div>

  <!-- Pánico con ¿DÓNDE? a la par -->
  <div class="grid-2">
    <div class="field">
      <div class="label">P <span>[PÁNICO]</span></div>
      <select id="panico">
        <option>No</option>
        <option>Si</option>
      </select>
    </div>
    <div id="panicoDondeContainer" class="conditional" style="margin-bottom: 0;">
      <div class="label">P - ¿DÓNDE?</div>
      <input type="text" id="panicoDonde" placeholder="Ubicación del pánico">
    </div>
    <!-- Celda vacía cuando está oculto, se maneja con CSS -->
  </div>

  <!-- Apagado -->
  <div class="field">
    <div class="label">A <span>[APAGADO]</span></div>
    <select id="apagado">
      <option>No</option>
      <option>Si. Normal 12V</option>
    </select>
  </div>

  <!-- Plataforma -->
  <div class="field">
    <div class="label">PT <span>[PLATAFORMA]</span></div>
    <select id="pt">
      <option value="CXPSFLEET">CXPSFLEET</option>
      <option value="COMPASSXPS">COMPASSXPS</option>
    </select>
  </div>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-text">MÓDULOS</span>
    <span class="divider-line"></span>
  </div>

  <!-- Módulos -->
  <div class="grid-4">
    <div class="field"><div class="label">RP</div><select id="rp" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">UG</div><select id="ug" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">DP</div><select id="dp" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">IGN</div><select id="ign" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">IC</div><select id="ic" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">CO</div><select id="co" class="select-sm"><option>Si</option><option>No</option></select></div>
    <div class="field"><div class="label">M</div><select id="m" class="select-sm"><option>No</option><option>Si</option></select></div>
  </div>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-text">TOPFLY</span>
    <span class="divider-line"></span>
  </div>

  <!-- Topfly -->
  <div class="field">
    <div class="label">TOPFLY</div>
    <select id="topfly">
      <option>No</option>
      <option>Si</option>
    </select>
  </div>

  <div id="topflyContainer" class="conditional">
    <div class="label">ID RELAY</div>
    <input type="text" id="idrelay" placeholder="Pegue el IDRelay">
    <div class="hint">Se generarán comandos BLERELAY automáticos</div>
  </div>

  <button class="btn btn-primary" id="generarBtn">▶ GENERAR TEXTO</button>
  
  <div id="resultado" class="result">
    <pre id="resultadoTexto"></pre>
  </div>
  
  <button id="btnCopy" class="btn btn-secondary" style="display: none;">📋 COPIAR</button>
</div>

<script>
  // Pánico: mostrar/ocultar campo "¿Dónde?" a la par
  const panicoSelect = document.getElementById('panico');
  const panicoDondeContainer = document.getElementById('panicoDondeContainer');
  const panicoDondeInput = document.getElementById('panicoDonde');

  function togglePanicoDonde() {
    if (panicoSelect.value === 'Si') {
      panicoDondeContainer.style.display = 'block';
      panicoDondeContainer.style.marginBottom = '0';
    } else {
      panicoDondeContainer.style.display = 'none';
      panicoDondeInput.value = '';
    }
  }

  panicoSelect.addEventListener('change', togglePanicoDonde);
  togglePanicoDonde(); // Estado inicial

  // Topfly: mostrar/ocultar campo IDRelay
  const topflySelect = document.getElementById('topfly');
  const topflyContainer = document.getElementById('topflyContainer');
  const idrelayInput = document.getElementById('idrelay');

  topflySelect.addEventListener('change', function() {
    topflyContainer.style.display = this.value === 'Si' ? 'block' : 'none';
    if (this.value !== 'Si') idrelayInput.value = '';
  });

  // Alinear texto (9 espacios)
  function pad(clave, valor) {
    const ancho = 9;
    let espacios = ' '.repeat(Math.max(ancho - clave.length, 0));
    return clave + espacios + ' : ' + valor;
  }

  // Generar boleta
  function generar() {
    const ahora = new Date();
    const opcionesFecha = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    const b = document.getElementById('numBoleta').value;
    const f = ahora.toLocaleDateString('es-ES', opcionesFecha);
    const h = ahora.toLocaleTimeString('es-ES');
    const t = document.getElementById('tecnico').value;
    const o = document.getElementById('operador').value;
    const tt = document.getElementById('tipoTrabajo').value;
    const up = document.getElementById('ubicacion').value;
    const p = document.getElementById('panico').value;
    const pd = document.getElementById('panicoDonde').value;
    const a = document.getElementById('apagado').value;
    const pt = document.getElementById('pt').value;
    const rp = document.getElementById('rp').value;
    const ug = document.getElementById('ug').value;
    const dp = document.getElementById('dp').value;
    const ign = document.getElementById('ign').value;
    const ic = document.getElementById('ic').value;
    const co = document.getElementById('co').value;
    const m = document.getElementById('m').value;
    const topfly = document.getElementById('topfly').value;
    const idrelay = document.getElementById('idrelay').value;

    let comandoTopfly = '';
    if (topfly === 'Si' && idrelay) {
      const apagadoTF = `BLERELAY,1234,${idrelay},654321,1#`;
      const encendidoTF = `BLERELAY,1234,${idrelay},654321,0#`;
      comandoTopfly = '\n\n' + pad('IDRelay', idrelay) + '\n' +
                       pad('APAGADO', apagadoTF) + '\n' +
                       pad('ENCENDIDO', encendidoTF);
    }

    const texto = pad('B', b) + '\n' +
                  pad('F', f) + '\n' +
                  pad('H', h) + '\n' +
                  pad('TEC', t) + '\n' +
                  pad('O', o) + '\n' +
                  pad('TT', tt) + '\n' +
                  pad('UP', up) + '\n' +
                  pad('P', p + (p === 'Si' && pd ? ' (' + pd + ')' : '')) + '\n' +
                  pad('A', a) + '\n' +
                  pad('PT', pt) + '\n' +
                  pad('RP', rp) + '\n' +
                  pad('UG', ug) + '\n' +
                  pad('DP', dp) + '\n' +
                  pad('IGN', ign) + '\n' +
                  pad('IC', ic) + '\n' +
                  pad('CO', co) + '\n' +
                  pad('M', m) +
                  comandoTopfly;

    const resultadoDiv = document.getElementById('resultado');
    const resultadoTexto = document.getElementById('resultadoTexto');
    resultadoTexto.innerText = texto;
    resultadoDiv.style.display = 'block';
    document.getElementById('btnCopy').style.display = 'block';
  }

  // Copiar al portapapeles
  function copiar() {
    const texto = document.getElementById('resultadoTexto').innerText;
    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.innerText = "✓ COPIADO";
      setTimeout(() => { btn.innerText = "📋 COPIAR"; }, 1500);
    }).catch(() => alert('No se pudo copiar'));
  }

  // Eventos
  document.getElementById('generarBtn').addEventListener('click', generar);
  document.getElementById('btnCopy').addEventListener('click', copiar);
</script>
</body>
</html>
